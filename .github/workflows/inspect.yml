name: Inspection de sources (temporaire)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Recherches
        run: |
          curl -sS "https://transport.data.gouv.fr/api/datasets" -o ds.json
          python3 - <<'PY'
          import json
          d=json.load(open('ds.json')); print(len(d), 'jeux')
          for x in d:
              t=(x.get('title') or '')
              if any(k in t.lower() for k in ['nationa','consolid','france enti','toute la france']):
                  print('#', x.get('slug'), '|', t, '|', x.get('type'))
                  for r in x.get('resources',[])[:6]: print('   ', r.get('title'), '|', r.get('format'), '|', r.get('original_url') or r.get('url'))
          PY
          echo "===== INSEE BPE sur data.gouv"
          curl -sS "https://www.data.gouv.fr/api/1/datasets/?organization=534fff81a3a7292c64a77e5c&q=equipements&page_size=5" -o b.json
          python3 - <<'PY'
          import json
          for x in json.load(open('b.json'))['data']:
              print('#', x['slug'], '|', x['last_modified'][:10])
              for r in x['resources'][:15]: print('   ', r['title'][:90], '|', r.get('format'), '|', r.get('filesize'), '|', r['url'])
          PY
          echo "===== arrets data.gouv"
          curl -sS "https://www.data.gouv.fr/api/1/datasets/?q=arrets%20transport%20en%20commun%20france%20consolide&page_size=6" -o a.json
          python3 -c "
          import json
          for x in json.load(open('a.json'))['data']:
              print('#', x['slug'], '|', (x.get('organization') or {}).get('name'), '|', x['last_modified'][:10])
              [print('   ', r['title'][:80], '|', r.get('format'), '|', r.get('filesize'), '|', r['url']) for r in x['resources'][:6]]"
