name: Inspection de sources (temporaire)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: BPE géolocalisée
        run: |
          pip install -q pyarrow
          curl -sS "https://www.data.gouv.fr/api/1/datasets/base-permanente-des-equipements-3/" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['title']);print((d.get('organization') or {}).get('name'));print(d['description'][:1200])"
          curl -sSL -o bpe.parquet "https://static.data.gouv.fr/resources/base-permanente-des-equipements-3/20260330-145351/bpe24.parquet"; ls -la bpe.parquet
          python3 - <<'PY'
          import pyarrow.parquet as pq
          t=pq.read_table('bpe.parquet'); print(t.num_rows); print(t.schema)
          df=t.slice(0,3).to_pylist(); print(df)
          import pyarrow.compute as pc
          ty=t.column('TYPEQU') if 'TYPEQU' in t.column_names else None
          if ty is not None:
              vc=pc.value_counts(ty).to_pylist(); print(sorted([ (v['values'],v['counts']) for v in vc if str(v['values']).startswith('B')]))
          PY
          echo "===== pages INSEE BPE"
          for u in https://www.insee.fr/fr/statistiques/8217525 https://www.insee.fr/fr/statistiques/8217527 https://www.insee.fr/fr/metadonnees/source/serie/s1161; do echo "-- $u"; curl -sSL -A "Mozilla/5.0" "$u" | grep -oE 'href="[^"]*(fichier|BPE|bpe)[^"]*"' | head -15; done
