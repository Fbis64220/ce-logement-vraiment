name: Inspection de sources (temporaire)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Codes commerce de la BPE 2024
        run: |
          pip install -q pyarrow
          curl -sSL -o bpe.parquet "https://static.data.gouv.fr/resources/base-permanente-des-equipements-3/20260330-145351/bpe24.parquet"
          python3 - <<'PY'
          import pyarrow.parquet as pq, pyarrow.compute as pc, random
          t=pq.read_table('bpe.parquet', columns=['TYPEQU','NOMRS','DEP','QUALITE_XY','LATITUDE'])
          for code in ['B101','B102','B103','B104','B105','B201','B202','B203','B204','B205','B206','B207','B208']:
              s=t.filter(pc.equal(t['TYPEQU'],code))
              if s.num_rows==0: print(code,'absent'); continue
              names=[n for n in s['NOMRS'].to_pylist() if n]; random.seed(1)
              print(code, s.num_rows, '| sans coord:', s.filter(pc.is_null(s['LATITUDE'])).num_rows, '|', ' / '.join(random.sample(names, min(10,len(names)))))
          print(sorted(set(pc.unique(t['QUALITE_XY']).to_pylist()), key=str))
          PY
          echo "===== liens INSEE"; curl -sSL -A "Mozilla/5.0" "https://www.insee.fr/fr/statistiques/8217525?sommaire=8217537" | grep -oE 'href="[^"]*(fichier|\.zip|\.parquet|\.csv)[^"]*"' | head -20
