name: Inspection de sources (temporaire)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Arrêts consolidés (transport.data.gouv.fr)
        run: |
          curl -sS "https://transport.data.gouv.fr/api/datasets" -o ds.json
          python3 - <<'PY'
          import json
          d=json.load(open('ds.json'))
          for x in d:
              t=((x.get('title') or '')+' '+(x.get('slug') or '')).lower()
              if ('france' in t or 'national' in t) and ('arr' in t or 'stop' in t or 'transport en commun' in t):
                  print('#', x.get('slug'), '|', x.get('title'), '|', x.get('type'), '| id', x.get('id'), x.get('datagouv_id'))
                  for r in x.get('resources',[])[:10]:
                      print('   ', r.get('title'), '|', r.get('format'), '|', r.get('original_url') or r.get('url'))
          PY
      - name: BPE (data.gouv.fr)
        run: |
          for q in "base permanente des equipements" "bpe geolocalise"; do
            curl -sS "https://www.data.gouv.fr/api/1/datasets/?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&page_size=6" -o b.json
            python3 - <<'PY'
          import json
          for x in json.load(open('b.json'))['data']:
              print('#', x['slug'], '|', (x.get('organization') or {}).get('name'), '|', x['last_modified'][:10])
              for r in x['resources'][:12]:
                  print('   ', r['title'][:80], '|', r.get('format'), '|', r.get('filesize'), '|', r['url'])
          PY
          done
